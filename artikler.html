.toast.on{opacity:1}

const KEY='nightlex-artikler';
let ST={name:'',marks:{}};
try{ST=Object.assign(ST,JSON.parse(localStorage.getItem(KEY)||'{}'))}catch(e){}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function store(){try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}}
function row(r,mode){const on=!!ST.marks[r.en];
  const shown=mode==='drop'?r.new:r.old;
  return `<button class="w${on?' on':''}" type="button" data-k="${esc(r.en)}" aria-pressed="${on}"><span class="x">${on?'✕':''}</span><span class="d">${esc(shown)}</span><span class="e">${esc(r.en)}</span></button>`}
function render(){
  const a=DATA.filter(r=>r.kind==='mass'),b=DATA.filter(r=>r.kind==='both'),c=DATA.filter(r=>r.kind==='unsure');
  const n=Object.values(ST.marks).filter(Boolean).length;
  document.getElementById('app').innerHTML=`
  <h1>en / et — hurtigt tjek</h1>
  <p class="mut">Hej, og tak fordi du hjælper Nightlex 💛 Vi vil vise nogle navneord <b>uden en/et</b>, fordi de normalt ikke tælles (fx <b>mælk</b>, <b>vand</b>, <b>viden</b>). Det har en AI foreslået — vi vil gerne have en dansker til at tjekke det.</p>
  <p class="mut sm">EN: We plan to show these nouns without en/et (uncountable). An AI suggested the lists — please correct it. It takes ~20 min, and every tap is saved automatically.</p>
  <div class="box"><label class="sm mut" for="nm">Dit navn · Your name</label><input class="t" id="nm" value="${esc(ST.name)}" placeholder="fx Trine" autocomplete="given-name"></div>
  <p class="sm mut">Markeret: <b>${n}</b> ord</p>
  <h2>1 · Uden en/et (${a.length})</h2>
  <p class="sm mut">Tryk på et ord, hvis det <b>SKAL have en/et</b> foran. · Tap a word if it SHOULD keep en/et.</p>
  <div class="list">${a.map(r=>row(r,'drop')).join('')}</div>
  <h2>2 · Med en/et — begge dele er fine (${b.length})</h2>
  <p class="sm mut">Tryk på et ord, hvis det tværtimod skal stå <b>UDEN en/et</b>. · Tap a word if it should be WITHOUT en/et.</p>
  <div class="list">${b.map(r=>row(r,'keep')).join('')}</div>
  <h2>3 · Usikre (${c.length})</h2>
  <p class="sm mut">Tryk, hvis ordet skal stå <b>UDEN en/et</b>. · Tap if it should be WITHOUT en/et.</p>
  <div class="list">${c.map(r=>row(r,'keep')).join('')}</div>`;
  document.getElementById('nm').oninput=e=>{ST.name=e.target.value.slice(0,60);store();later()};
}
document.addEventListener('click',e=>{const b=e.target.closest('.w');if(!b)return;const k=b.dataset.k;ST.marks[k]=!ST.marks[k];if(!ST.marks[k])delete ST.marks[k];store();
  const y=window.scrollY;render();window.scrollTo(0,y);later()});

function nxClient(){try{let c=localStorage.getItem('nightlex-client');if(!c){c=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2));localStorage.setItem('nightlex-client',c)}return c+'-art'}catch(e){return ''}}
async function save(){const c=nxClient();if(!c)return false;try{const r=await fetch(NX_API+'/save',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({kind:'report',client:c,lang:'da',name:ST.name||'',data:{app:'artikler',v:1,name:ST.name||'',date:new Date().toISOString(),marks:ST.marks,total:DATA.length}})});const j=await r.json().catch(()=>({}));return r.ok&&j.ok}catch(e){return false}}
let tm=null;function later(){clearTimeout(tm);tm=setTimeout(save,4000)}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),2200)}
document.getElementById('send').onclick=async()=>{clearTimeout(tm);const ok=await save();
  if(ok){document.getElementById('app').innerHTML=`<div class="done"><b>Tak for din hjælp! 💛</b><p class="mut">Dine svar er gemt. Du kan altid åbne siden igen og rette.</p><p class="mut sm">Thank you! Your answers are saved.</p></div>`;window.scrollTo(0,0);document.querySelector('.dock').style.display='none'}else toast('Ingen forbindelse — prøv igen · No connection')};
render();
</script>
</body>
</html>

:root{color-scheme:dark;--bg:#19181B;--card:#2B2A2F;--card2:#35333A;--line:#3D3A41;--ink:#FBF9F6;--mut:#B9B2BA;--acc:#FFA5B8;--acc-ink:#19181B;--ok:#7BD88F;--bad:#FF8A8A;--fix:#F2C14E;--blue:#9DB4FF}

main{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 110px);min-height:100dvh;display:flex;flex-direction:column}

.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}.chip.on small{color:inherit;opacity:.75}
.chip:focus-visible,.btn:focus-visible,.ch:focus-visible,.tag:focus-visible,.ic:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
input.t,textarea.t{width:100%;font:inherit;color:var(--ink);background:var(--card2);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
textarea.t{min-height:64px;resize:vertical}
input.t:focus,textarea.t:focus{outline:none;border-color:var(--acc)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:0 18px;border-radius:18px;font-weight:800;font-size:17px;background:var(--acc);color:var(--acc-ink);width:100%;box-shadow:0 6px 16px -8px rgba(120,90,30,.45)}

.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}

.lvb b{display:block;font:800 18px Unbounded,sans-serif}.lvb small{color:var(--mut);font-size:12px}
.lvb.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.bar{height:5px;border-radius:5px;background:var(--line);overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--acc)}

.top{display:flex;align-items:center;gap:12px}
.ic{all:unset;cursor:pointer;width:44px;height:44px;border-radius:14px;background:var(--card);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:none}

.ch{all:unset;cursor:pointer;box-sizing:border-box;min-height:64px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:800;font-size:15px}
.ch svg{width:20px;height:20px}
.ch.ok{color:var(--ok)}.ch.bad{color:var(--bad)}.ch.fix{color:var(--fix)}

.tag.on{background:color-mix(in srgb,var(--fix) 30%,var(--card2));color:var(--fix)}
.links{display:flex;justify-content:space-between;margin-top:14px;font-size:14px}
.lk{all:unset;cursor:pointer;color:var(--mut);text-decoration:underline;text-underline-offset:3px}
.note{font-size:13px;color:var(--mut);text-align:center}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%);background:var(--card2);border:1px solid var(--line);padding:10px 16px;border-radius:14px;font-weight:700;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
.toast.on{opacity:1}
.stat{display:flex;gap:8px;margin:10px 0}.stat div{flex:1;background:var(--card2);border-radius:14px;padding:10px;text-align:center}.stat b{display:block;font:800 20px Unbounded,sans-serif}.stat small{font-size:12px;color:var(--mut)}

@media (prefers-reduced-motion:reduce){.toast{transition:none}}

html{background:#111013}body{background:transparent!important}

/* ---------- перевірка ---------- */
function queue(){const R=res();return ITEMS.filter(i=>(ST.kind==='all'||i.k===ST.kind))}

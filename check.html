let PROG=null,PROG_T=0,PROG_L='';

    if(r.ok){PROG=await r.json();PROG_T=Date.now();PROG_L=ST.lang}}catch(e){}return PROG&&PROG_L===ST.lang?PROG:null}
function srvN(id){return PROG&&PROG_L===ST.lang&&PROG.ids?PROG.ids[id]||0:0}

  const gl=el('div',{class:'gl'},el('button',{class:'ic','aria-label':t.speak,html:IC.spk,onclick:()=>say(CUR.x)}),CUR.g&&t.gloss?el('span',{},`${t.gloss}: `,el('b',{},CUR.g)):null);

// виділяємо слово в реченні (без артикля / at / to), решту — як текст (жодного HTML з даних)

/* озвучка записами гри (22.11.2026, автор: «для тесту носіїв також має бути озвучка»): той самий голос, що в Nightlex
   (audio/<мова>/g/<ключ>.m4a; речення текстів — r<ключ>); немає запису — голос пристрою, як раніше. Ключ — той самий рахунок, що ttsKey у грі. */
function ttsKey(t){t=String(t==null?'':t).replace(/\s+/g,' ').trim();const b=new TextEncoder().encode(t);let a=0x811c9dc5,c=0x9747b28c;
  for(const x of b){a=Math.imul(a^x,0x01000193);c=Math.imul(c^x,0x01000193)}return ((a>>>0).toString(16).padStart(8,'0')+(c>>>0).toString(16).padStart(8,'0')).slice(0,12)}
let SAY_A=null;
function say(s){const k=ttsKey(s),base='audio/'+ST.lang+'/g/',kind=CUR&&CUR.k;
  const cand=(kind==='t'?['r'+k+'.m4a','r'+k+'.mp3']:[]).concat([k+'.m4a',k+'.mp3']);
  try{speechSynthesis.cancel()}catch(e){}if(SAY_A)try{SAY_A.pause()}catch(e){}
  const tryN=i=>{if(i>=cand.length)return sayDev(s);const a=new Audio(base+cand[i]);SAY_A=a;let gone=false;const next=()=>{if(gone)return;gone=true;tryN(i+1)};
    a.onerror=next;const p=a.play();if(p&&p.catch)p.catch(()=>{if(a.error||a.networkState===3)next()})};tryN(0)}

document.addEventListener('keydown',e=>{if(!CUR||/input|textarea/i.test((e.target.tagName||'')))return;if(e.key==='1')choose('ok');else if(e.key==='2')choose('bad');else if(e.key==='3')choose('fix')});

/* ---------- база Nightlex (Cloudflare D1, 22.11.2026): відповіді зберігаються на сервері Nightlex; файл / «поділитися» лишаються запасним шляхом ---------- */
const NX_API='https://api.nightlex.com';
function nxClient(){try{let c=localStorage.getItem('nightlex-client');if(!c){c=(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2));localStorage.setItem('nightlex-client',c)}return c}catch(e){return ''}}
async function nxSave(kind,lang,name,data){try{const c=nxClient();if(!c)return false;const r=await fetch(NX_API+'/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,client:c,lang,name,data})});const j=await r.json().catch(()=>({}));return r.ok&&j.ok}catch(e){return false}}
/* ---------- надіслати: файл / поділитися / копіювати ---------- */
/* знімок екрана з коментарем → сервер Nightlex (22.11.2026): картинка зменшується на телефоні до ≤ 1400 px (JPEG), щоб швидко надсилалась */

  const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*k);c.height=Math.round(im.naturalHeight*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
  let q=.82,d=c.toDataURL('image/jpeg',q);while(d.length>1900000&&q>.4){q-=.12;d=c.toDataURL('image/jpeg',q)}return d}finally{}}

  const r=await fetch(NX_API+'/shot',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client:c,lang,page,comment:String(comment||'').slice(0,2000),img})});
  const j=await r.json().catch(()=>({}));return r.ok&&j.ok?'ok':(j.error==='limit'?'limit':'err')}catch(e){return 'err'}}
